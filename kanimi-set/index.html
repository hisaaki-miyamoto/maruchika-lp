<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<meta property="og:title" content="香住ガニ かに身セット｜むき身600g・かに味噌・かに酢付き" />
<meta property="og:image" content="images/lp/kanimi_image_lp.jpg" />
<link rel="icon" href="images/lp/favicon-emblem.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="images/lp/favicon-emblem-32.png" />
<link rel="apple-touch-icon" href="images/lp/apple-touch-emblem.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#efe9df; --gold-dp:#8c6a28; --muted:#8c8374; --line:#e8dfce; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{
    display:flex; justify-content:center;
    -webkit-text-size-adjust:100%;
  }
  /* 画像LPの基準幅は750px。PCでは中央寄せ、スマホでは画面幅いっぱいに自動縮小 */
  .lp{ width:100%; max-width:750px; background:#faf6ee; box-shadow:0 0 40px rgba(0,0,0,.12); }
  .lp-main{ display:block; width:100%; height:auto; }

  /* 最上段ヘッダー（エンブレム＋社名） */
  .lp-head{
    display:flex; align-items:center; gap:10px;
    padding:12px clamp(14px,3.5vw,20px);
    background:#fff; border-bottom:1px solid var(--line);
  }
  .lp-head img{ height:clamp(36px,6vw,44px); width:auto; display:block; }
  .lp-head span{
    font-family:"Shippori Mincho", serif; font-weight:700; color:var(--gold-dp);
    font-size:clamp(12.5px,3.4vw,15px); letter-spacing:.05em; white-space:nowrap;
  }

  /* 最下段フッター（wordmark＋コピーライト・中央揃え） */
  /* 下部余白は、追従ボタンがロゴ・コピーライトに重ならないよう広めに確保 */
  .lp-foot{ text-align:center; padding:clamp(26px,5vw,38px) 16px clamp(120px,18vw,150px); background:#faf6ee; }
  .lp-foot img{ height:clamp(34px,7vw,46px); width:auto; display:block; margin:0 auto 14px; }
  .lp-foot p{ font-family:"Shippori Mincho", serif; color:var(--muted); font-size:12px; letter-spacing:.08em; }

  /* 右下に常に追従する購入ボタン（フローティングCTA） */
  .float-cta{
    position:fixed;
    right:clamp(14px, 3vw, 28px);
    bottom:clamp(64px, 9vw, 82px);
    z-index:1000;
    display:inline-flex; align-items:center; gap:8px;
    padding:15px 26px;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-weight:700; font-size:clamp(14px,3.6vw,16px); letter-spacing:.04em;
    color:#fff; text-decoration:none;
    background:linear-gradient(180deg,#c43a2d,#b3261d 60%,#9c1f17);
    border:1px solid #d6493d; border-radius:999px;
    box-shadow:0 10px 26px rgba(168,30,21,.40), 0 2px 6px rgba(0,0,0,.18);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .float-cta:hover{ transform:translateY(-3px); box-shadow:0 16px 34px rgba(168,30,21,.46); }
  .float-cta .ic{ transition:transform .25s ease; }
  .float-cta:hover .ic{ transform:translateX(4px); }
  /* スマホでは少しコンパクトに（画面を覆い過ぎない） */
  @media (max-width:480px){
    .float-cta{ padding:13px 20px; right:12px; bottom:58px; }
  }
</style>
</head>
<body>
  <div class="lp">
    <!-- 最上段：ブランドヘッダー -->
    <header class="lp-head">
      <img src="images/lp/maruchika-emblem.png" alt="株式会社 丸近" width="500" height="500" decoding="async" />
      <span>株式会社丸近｜【公式サイト】</span>
    </header>

    <!-- 縦長画像LP本体 -->
    <img class="lp-main" src="images/lp/kanimi_image_lp.jpg"
         alt="香住ガニ かに身セット むき身600g（300g×2パック）かに味噌・かに酢付き 税込6,800円"
         width="750" height="6245" decoding="async" />

    <!-- 最下段：wordmarkロゴ＋コピーライト（中央揃え） -->
    <footer class="lp-foot">
      <img src="images/lp/maruchika-wordmark.png" alt="株式会社 丸近" width="550" height="200" decoding="async" />
      <p>© 2026　株式会社 丸近</p>
    </footer>
  </div>

  <!-- 右下に追従する購入ボタン -->
  <a class="float-cta"
     href="https://www.kani-mrck.com/view/item/000000000017?category_page_id=kanimi"
     target="_blank" rel="noopener">
    <span>ショップで購入する</span><span class="ic">→</span>
  </a>
</body>
</html>
